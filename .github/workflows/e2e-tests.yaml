name: E2E Tests

on:
  pull_request:
    branches:
      - main
      - develop
      - production
      - "frontend/**"
      - "control-station/**"
      - "testing-view/**"
      - "e2e/**"
    paths:
      - "frontend/testing-view/**"
      - "frontend/competition-view/**"
      - "frontend/logging-view/**"
      - "frontend/adj-view/**"
      - "frontend/frontend-kit/**"
      - "backend/**"
      - "electron-app/**"
      - "e2e/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e-tests.yaml"

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "testing-view..." --filter "competition-view..." --filter "logging-view..." --filter "adj-view..." --filter "e2e..." --filter "hyperloop-control-station..."

      - name: Build backend binary
        run: |
          mkdir -p electron-app/binaries
          cd backend/cmd && go build -o ../../electron-app/binaries/backend-windows-amd64.exe .

      - name: Patch backend config
        run: sed -i 's/validate = true/validate = false/' backend/cmd/dev-config.toml

      - name: Install Electron binary
        run: node node_modules/electron/install.js
        working-directory: e2e

      - name: Debug - verify Electron binary
        run: |
          node -e "const e = require('electron'); console.log('Electron path:', e);"
          ls -la "$(node -e "process.stdout.write(require('electron'))")"
        working-directory: e2e

      - name: Build E2E renderers
        run: pnpm --dir e2e build

      - name: Run UI and integration tests
        run: pnpm --dir e2e test:fast
        env:
          E2E_REQUIRED_VIEWS: testing,competition,logging,adj
