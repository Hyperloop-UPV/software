name: Rust Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/rust-tests.yaml"

jobs:
  test:
    name: Test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # software-core's modules sit behind features (net, git, logger,
          # ntp, http...) that are all off by default: without
          # --all-features none of their tests would run, UDP's included.
          - crate: software-core
            flags: --all-features
          - crate: station
            flags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run tests
        working-directory: backend
        run: cargo test --package ${{ matrix.crate }} ${{ matrix.flags }}
