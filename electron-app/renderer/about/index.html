<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>About Control Station</title>
    <link rel="stylesheet" href="./about.css" />
    <script src="./about.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <img
          src="../mode-selector/src/logo.svg"
          alt="Hyperloop UPV"
          class="team-logo"
        />
        <img
          src="../mode-selector/src/Subsystem.png"
          alt="Hyperloop UPV Software"
          class="software-logo"
        />
        <h1>Control Station</h1>
        <p id="app-version">Version —</p>
        <p class="team">Hyperloop UPV · Software</p>
      </header>
      <section aria-labelledby="contributors-title">
        <h2 id="contributors-title">Contributors</h2>
        <ul id="contributors" aria-label="Contributors by commit count"></ul>
        <p id="load-error" role="alert" hidden>
          Could not load the bundled credits.
        </p>
        <p id="link-error" role="alert" hidden>
          Could not open the GitHub profile in your browser.
        </p>
      </section>
      <footer>
        <p>Logging View: Javier Ribal del Río — H11</p>
        <p id="credits-date"></p>
        <p>© Hyperloop UPV · Software · MIT License</p>
      </footer>
    </main>
  </body>
</html>
